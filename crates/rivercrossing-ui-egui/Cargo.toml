[package]
name = "rivercrossing-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
craft = { workspace = true, features = ["automation", "dialogs", "menu", "platform", "window"] }
eframe = { workspace = true }
rivercrossing-cards = { path = "../rivercrossing-cards", version = "=0.1.0" }
rivercrossing-csvio = { path = "../rivercrossing-csvio", version = "=0.1.0" }
rivercrossing-hands = { path = "../rivercrossing-hands", version = "=0.1.0" }
rivercrossing-htmlexport = { path = "../rivercrossing-htmlexport", version = "=0.1.0" }
rivercrossing-pdfexport = { path = "../rivercrossing-pdfexport", version = "=0.1.0" }
rivercrossing-ride = { path = "../rivercrossing-ride", version = "=0.1.0" }
rivercrossing-rider-issues = { path = "../rivercrossing-rider-issues", version = "=0.1.0" }
rivercrossing-roster = { path = "../rivercrossing-roster", version = "=0.1.0" }
rivercrossing-standings = { path = "../rivercrossing-standings", version = "=0.1.0" }
rivercrossing-store = { path = "../rivercrossing-store", version = "=0.1.0" }
rivercrossing-wordpress = { path = "../rivercrossing-wordpress", version = "=0.1.0" }
rodio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

# macOS window presentation the eframe builder cannot express: AppKit puts a window tab bar on the
# root window unless its tabbing mode is disallowed (`ui/macos.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow"] }

[dev-dependencies]
craft = { workspace = true, features = ["ui-testing"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
mockall = "=0.15.0"
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = "3"

[lints]
workspace = true

# The snapshot harness target; `[profile.ui]` selects it.
[[test]]
name = "ui"
path = "tests/ui/main.rs"
