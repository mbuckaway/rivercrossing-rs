# cargo-deny configuration for the RS gate (`cargo deny --locked --config deny.toml check`).
# Bans and advisories are tightened crate-by-crate as dependencies land.

[advisories]
vulnerability = "deny"
unmaintained = "deny"
yanked = "deny"
notice = "warn"

[licenses]
allow = ["GPL-3.0-only", "MIT", "Apache-2.0", "Zlib", "Unicode-DFS-2016", "ISC", "BSD-2-Clause", "BSD-3-Clause", "OFL-1.1"]
copyleft = "deny"
default = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
