# rivercrossing-rs — Cargo workspace.
#
# This is the virtual workspace manifest. Members are added crate-by-crate by
# the EPIC agents: EPIC-1 adds `crates/rivercrossing-ui-egui` and then
# `apps/rivercrossing`; the domain crates land in build order (see
# CODE_STRUCTURE.md).

[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/mbuckaway/rivercrossing-rs"
authors = ["Mark Buckaway"]

[workspace.dependencies]
# The ArtCraft façade: egui plus the craft-ui shell/window/settings stack, at one
# pinned rev. `ui-app` is `craft-ui/app`, which is what brings `shell::app::run`.
craft = { git = "https://github.com/storytold/craft-libs", rev = "243d68e12d05e89122db6d154924bf1992e10d38", version = "=0.1.0", default-features = false, features = ["ui", "ui-app"] }
# Named for `eframe::Result`: the façade re-exports egui but not eframe. The craft
# shell enables eframe's wgpu/x11/default_fonts features for the whole graph.
eframe = { version = "0.37", default-features = false }
# CLI + MCP (EPIC-13): the shared MCP server machinery (JSON-RPC 2.0 over stdio), craft-libs rev.
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "243d68e12d05e89122db6d154924bf1992e10d38", version = "=0.1.0" }

# Domain-crate and test dependencies.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
# SQLite for the store crate: bundled so no system SQLite is required on any platform.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
rstest = "0.28"
pretty_assertions = "1"
# Wall-clock instants for the ride engine: ISO-8601 payloads (Rfc3339) and epoch seconds.
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# Entry identity: uuid4 hex, minted by the roster and persisted by the store.
uuid = { version = "1", features = ["v4"] }
# HTML export: Jinja2-compatible templates (the MarkupSafe-style formatter is our own).
minijinja = { version = "3.1", features = ["serde"] }
# Data-URI encoding for the organizer logo.
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Source-file header convention: a single SPDX line, per AGENTS.md.
# `// SPDX-License-Identifier: GPL-3.0-only`

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
allow_attributes_without_reason = "deny"
cognitive_complexity = "warn"

# Dependency builds optimised, our crates debuggable: an unoptimised egui/wgpu
# graph is unusably slow and enormous. Same shape as WordCraft's.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Workspace deps whose crates land in later EPICs (craft-mcp-server: EPIC-13).
[workspace.metadata.cargo-machete]
ignored = ["craft-mcp-server"]

# storytold's egui/winit forks. `[patch.crates-io]` does not propagate from
# craft-libs to consumers, so this workspace must repeat it. The set matches
# WordCraft's egui entries; the krilla/hayro*/linesweeper vendor patches are only
# needed once craft-pdf lands (EPIC-9).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
emath = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
