name: Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      # Full history so `gitleaks git` scans every commit, not just HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1 python3

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install Rust toolchains
        run: |
          rustup component add rustfmt clippy llvm-tools
          rustup toolchain install nightly-2026-11-05 --profile minimal -c llvm-tools
          rustup toolchain install 1.95.0 --profile minimal

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete,cargo-hack

      - name: Run the gate
        env:
          WGPU_BACKEND: vulkan
        run: ./scripts/validate-rust.sh
