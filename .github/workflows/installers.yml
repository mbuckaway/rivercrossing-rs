name: Installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the macOS DMG
        run: bash packaging/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: target/package/RiverCrossing-*-macos-arm64.dmg
          if-no-files-found: error

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Windows x64 installer
        shell: pwsh
        run: ./packaging/package-windows.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/package/RiverCrossing-*-windows-x64.msi
            target/package/RiverCrossing-*-windows-x64-portable.zip
          if-no-files-found: error

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the Windows arm64 installer
        shell: pwsh
        run: ./packaging/package-windows.ps1 -Arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            target/package/RiverCrossing-*-windows-arm64.msi
            target/package/RiverCrossing-*-windows-arm64-portable.zip
          if-no-files-found: error

  # ubuntu-22.04 gives the glibc 2.35 portability floor. The hosted label is
  # deprecated (retirement Apr 2027); migrate to ubuntu-24.04 + a
  # container: ubuntu:22.04 build step before then.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the Linux packages
        run: bash packaging/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            target/package/RiverCrossing-*-linux-amd64.deb
            target/package/RiverCrossing-*-linux-amd64.rpm
          if-no-files-found: error

  # A version tag that matches the workspace version and has a CHANGELOG section
  # publishes the GitHub release: the versioned installers plus SHA256SUMS.txt,
  # with GitHub's generated notes followed by the version's CHANGELOG section.
  # Nothing publishes if a build job or a guard is red.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-x64, windows-arm64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the workspace version
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml \
            | sed 's/^version = "\(.*\)"/\1/')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            printf 'tag %s does not match Cargo.toml version %s -- bump it before tagging\n' \
              "${GITHUB_REF_NAME}" "${version}" >&2
            exit 1
          fi

      - name: Extract the CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "${version}" > changelog-section.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          ver = re.escape(sys.argv[1])
          m = re.search(rf"(?ms)^(## \[{ver}\].*?)(?=^## \[|\Z)", text)
          sys.stdout.write((m.group(1).rstrip() + "\n") if m else "")
          PY
          if [ ! -s changelog-section.md ]; then
            printf 'no CHANGELOG section for %s -- add it before tagging\n' "${version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the release assets
        run: |
          mkdir -p assets
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.zip' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} assets/ \;
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --generate-notes assets/*
          fi
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > notes.md
          { cat notes.md; printf '\n\n---\n\n'; cat changelog-section.md; } \
            > combined.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file combined.md
