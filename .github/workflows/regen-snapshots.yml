# Temporary: regenerate the Linux golden snapshots after a version bump, then
# download the `snapshots` artifact. Delete once the new golden is committed.
name: Regen snapshots

on:
  workflow_dispatch:
  pull_request:

jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Regenerate snapshots
        env:
          WGPU_BACKEND: vulkan
          UPDATE_SNAPSHOTS: force
        run: cargo nextest run -P ui -p rivercrossing-ui-egui --locked
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: crates/rivercrossing-ui-egui/tests/snapshots/
